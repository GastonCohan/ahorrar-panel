    <!--
      Tablero de métricas de Ahorr-AR (docs/decisiones/0012). Página estática, sin datos: los trae
      de la función panel-metricas de Supabase con la clave del panel (la guarda solo este
      navegador). Se publica en GitHub Pages (repo gastoncohan/ahorrar-panel); la fuente es
      scripts/panel/index.html del repo de la app. ?demo muestra datos de ejemplo.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f7f6;
        --card: #ffffff;
        --ink: #0f1a17;
        --ink-2: #33433f;
        --muted: #6b7a76;
        --line: #e4eae8;
        --line-2: #eef2f1;
        --brand: #10624b;
        --brand-2: #1a7a5d;
        --brand-soft: #eaf6f0;
        --chart: #1a7a5d;
        --chart-fill: rgba(26, 122, 93, 0.12);
        --ok: #1a7a5d;
        --ok-soft: #e6f4ee;
        --warn: #b3261e;
        --warn-soft: #fcebe9;
        --amber: #9a6700;
        --amber-soft: #fff4d6;
        --topbar: #0a4438;
        --shadow: 0 1px 2px rgba(16, 24, 20, 0.04), 0 1px 3px rgba(16, 24, 20, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1210;
          --card: #121c19;
          --ink: #eef2f1;
          --ink-2: #c9d3d0;
          --muted: #8a9894;
          --line: #1f2c28;
          --line-2: #18231f;
          --brand: #8fd0bb;
          --brand-2: #3fa283;
          --brand-soft: #0f2a23;
          --chart: #3fa283;
          --chart-fill: rgba(63, 162, 131, 0.18);
          --ok: #8fd0bb;
          --ok-soft: #0f2a23;
          --warn: #ffb4ab;
          --warn-soft: #3a1a17;
          --amber: #ffd479;
          --amber-soft: #33270a;
          --topbar: #07201a;
          --shadow: none;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 120px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-feature-settings: 'cv11', 'ss01';
        -webkit-font-smoothing: antialiased;
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }

      /* ——— barra superior ——— */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--topbar);
        color: #fff;
      }
      .topbar-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.2px;
        white-space: nowrap;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #8fd0bb;
        color: #0a4438;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 800;
      }
      .brand small {
        font-weight: 500;
        opacity: 0.7;
        font-size: 13px;
        margin-left: 2px;
      }
      .topbar-meta {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      .stamp {
        opacity: 0.75;
        white-space: nowrap;
      }
      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        text-decoration: none;
        white-space: nowrap;
        font-weight: 500;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3fd39f;
        flex: none;
      }
      .dot.warn {
        background: #ff8a80;
      }
      .dot.amber {
        background: #ffc845;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        font-size: 13px;
        min-height: 36px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: transparent;
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .btn.primary {
        background: #8fd0bb;
        border-color: #8fd0bb;
        color: #0a4438;
      }
      .btn.primary:hover {
        background: #a6dbc9;
      }
      .btn:focus-visible,
      .nav a:focus-visible,
      input:focus-visible {
        outline: 2px solid #3fa283;
        outline-offset: 2px;
      }
      .nav {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .nav-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .nav a {
        color: rgba(255, 255, 255, 0.72);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        padding: 10px 10px;
        white-space: nowrap;
        border-bottom: 2px solid transparent;
      }
      .nav a:hover,
      .nav a.on {
        color: #fff;
        border-bottom-color: #8fd0bb;
      }

      /* ——— contenido ——— */
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        gap: 24px;
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 8px 0 -8px;
      }
      .section-head h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .section-head p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .card-head {
        padding: 16px 20px 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .card-head h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .card-head p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12.5px;
      }
      .card-body {
        padding: 12px 20px 16px;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .g4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .g2 {
        grid-template-columns: 1fr 1fr;
      }
      .g32 {
        grid-template-columns: 3fr 2fr;
      }
      @media (max-width: 960px) {
        .g4 {
          grid-template-columns: repeat(2, 1fr);
        }
        .g2,
        .g32 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 640px) {
        main {
          padding: 16px;
          gap: 20px;
        }
        .topbar-inner {
          padding: 10px 16px;
          flex-wrap: wrap;
          gap: 8px 12px;
        }
        .topbar-meta {
          width: 100%;
          margin-left: 0;
          justify-content: space-between;
        }
        .stamp {
          display: none;
        }
        .card-head {
          padding: 14px 16px 0;
        }
        .card-body {
          padding: 10px 16px 14px;
        }
      }

      /* KPIs */
      .kpi {
        padding: 16px 20px;
        display: grid;
        gap: 6px;
      }
      .kpi-label {
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 500;
      }
      .kpi-value {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.8px;
        line-height: 1.1;
      }
      .kpi-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 22px;
      }
      .delta {
        font-size: 12px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 6px;
        background: var(--line-2);
        color: var(--muted);
      }
      .delta.up {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .delta.down {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .kpi-note {
        color: var(--muted);
        font-size: 12px;
      }
      .spark {
        width: 84px;
        height: 24px;
        flex: none;
      }

      /* gráfico */
      .chart-wrap {
        position: relative;
      }
      .chart-wrap svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .tip {
        position: absolute;
        pointer-events: none;
        background: var(--ink);
        color: var(--card);
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 6px;
        white-space: nowrap;
        transform: translate(-50%, -120%);
        opacity: 0;
        transition: opacity 0.1s;
      }
      .tip b {
        font-size: 13px;
      }
      .range {
        display: inline-flex;
        background: var(--line-2);
        border-radius: 8px;
        padding: 2px;
      }
      .range button {
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
        min-height: 28px;
      }
      .range button.on {
        background: var(--card);
        color: var(--ink);
        box-shadow: var(--shadow);
      }

      /* tablas */
      .table-wrap {
        overflow-x: auto;
        margin: 0 -20px;
        padding: 0 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 8px;
        border-bottom: 1px solid var(--line-2);
        vertical-align: middle;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;
        border-bottom-color: var(--line);
        white-space: nowrap;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      th:first-child,
      td:first-child {
        padding-left: 0;
      }
      th:last-child,
      td:last-child {
        padding-right: 0;
      }
      td.n,
      th.n {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      td.strong {
        font-weight: 600;
      }
      .heat {
        display: inline-block;
        min-width: 52px;
        padding: 2px 6px;
        border-radius: 6px;
        text-align: right;
      }
      .barcell {
        display: grid;
        gap: 4px;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--line-2);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--chart);
        border-radius: 3px;
      }

      /* estados */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--line-2);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .badge.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .badge.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .health-summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-bottom: 1px solid var(--line);
      }
      .health-summary > div {
        padding: 16px 20px;
        border-right: 1px solid var(--line);
      }
      .health-summary > div:last-child {
        border-right: 0;
      }
      .health-summary b {
        display: block;
        font-size: 22px;
        letter-spacing: -0.5px;
      }
      .health-summary span {
        color: var(--muted);
        font-size: 12.5px;
      }
      @media (max-width: 640px) {
        .health-summary {
          grid-template-columns: 1fr 1fr;
        }
        .health-summary > div:nth-child(2) {
          border-right: 0;
        }
        .health-summary > div:nth-child(-n + 2) {
          border-bottom: 1px solid var(--line);
        }
      }
      .subhead {
        margin: 18px 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .subhead:first-child {
        margin-top: 4px;
      }
      .issue {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 4px 12px;
        align-items: start;
        padding: 12px 0;
        border-bottom: 1px solid var(--line-2);
      }
      .issue:last-child {
        border-bottom: 0;
      }
      .issue .dot {
        margin-top: 6px;
      }
      .issue-title {
        font-weight: 600;
      }
      .issue-meta {
        color: var(--muted);
        font-size: 12.5px;
      }
      .issue-side {
        text-align: right;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .mono {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .issue .mono {
        grid-column: 2 / 4;
        color: var(--ink-2);
        background: var(--line-2);
        padding: 6px 8px;
        border-radius: 6px;
      }
      .issue .extra {
        grid-column: 2 / 4;
      }
      .quote {
        color: var(--ink-2);
        font-size: 13px;
        border-left: 2px solid var(--line);
        padding-left: 8px;
        margin-top: 4px;
      }
      details summary {
        cursor: pointer;
        color: var(--brand);
        font-size: 13px;
        font-weight: 600;
        min-height: 32px;
        display: flex;
        align-items: center;
        list-style: none;
      }
      details summary::before {
        content: '›';
        display: inline-block;
        margin-right: 6px;
        transition: transform 0.15s;
        font-size: 16px;
      }
      details[open] summary::before {
        transform: rotate(90deg);
      }
      details summary::-webkit-details-marker {
        display: none;
      }
      pre {
        margin: 6px 0 0;
        padding: 10px;
        background: var(--line-2);
        border-radius: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
        padding: 8px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .error-box {
        background: var(--warn-soft);
        color: var(--warn);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
      }

      /* login y carga */
      .center {
        min-height: calc(100vh - 160px);
        display: grid;
        place-items: center;
      }
      .login {
        width: 100%;
        max-width: 380px;
        padding: 28px;
        display: grid;
        gap: 14px;
      }
      .login h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.3px;
      }
      .login p {
        margin: -6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .field {
        position: relative;
      }
      .field input {
        width: 100%;
        font: inherit;
        padding: 12px 84px 12px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        min-height: 46px;
      }
      .field button {
        position: absolute;
        right: 6px;
        top: 6px;
        bottom: 6px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        background: var(--line-2);
        color: var(--ink-2);
        padding: 0 10px;
        cursor: pointer;
      }
      .submit {
        font: inherit;
        font-weight: 600;
        min-height: 46px;
        border: 0;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        .submit {
          color: #0a4438;
        }
      }
      .skeleton {
        height: 96px;
        border-radius: 12px;
        background: linear-gradient(90deg, var(--line-2), var(--line), var(--line-2));
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite linear;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      .demo {
        background: #ffc845;
        color: #0b1512;
        text-align: center;
        font-weight: 600;
        font-size: 12.5px;
        padding: 6px;
      }
      footer {
        max-width: 1200px;
        margin: 0 auto;
        padding: 8px 24px 32px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>

    </header>
    <main id="app"></main>
    <footer id="footer" hidden>
      Estadísticas anónimas: sin nombres ni datos personales. Solo de quienes comparten estadísticas
      desde la app.
    </footer>

    <script>
      'use strict';
      const API = 'https://pjyipjmjukuoasovpiug.supabase.co/functions/v1/panel-metricas';
      const KEY = 'ahorrar.panel.clave';
      const app = document.getElementById('app');
      const meta = document.getElementById('meta');
      const nav = document.getElementById('nav');
      const footer = document.getElementById('footer');
      const demo = new URLSearchParams(location.search).has('demo');

      // ——— utilidades: todo el texto va con textContent (los comentarios los escribe la gente) ———
      function el(tag, attrs, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs || {})) {
          if (v == null || v === false) continue;
          if (k === 'class') node.className = v;
          else if (k === 'text') node.textContent = v;
          else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
          else node.setAttribute(k, v);
        }
        for (const c of children) if (c) node.append(c);
        return node;
      }
      const svgEl = (tag, attrs) => {
        const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
        return n;
      };
      const num = (n) => Number(n || 0).toLocaleString('es-AR');
      const porcentaje = (v) =>
        Number(v).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + '%';
      const fecha = (iso) =>
        new Date(iso + (iso.length === 10 ? 'T12:00:00' : '')).toLocaleDateString('es-AR', {
          day: '2-digit',
          month: '2-digit',
        });
      const fechaLarga = (iso) =>
        new Date(iso + (iso.length === 10 ? 'T12:00:00' : '')).toLocaleDateString('es-AR', {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
        });
      // "29/09 08:09", corto para que entre en el celular.
      const fechaHora = (iso) => {
        const d = new Date(iso);
        const dos = (n) => String(n).padStart(2, '0');
        return `${dos(d.getDate())}/${dos(d.getMonth() + 1)} ${dos(d.getHours())}:${dos(d.getMinutes())}`;
      };
      const plural = (n, uno, varios) => `${num(n)} ${Number(n) === 1 ? uno : varios}`;

      // La clave queda en memoria mientras la página está abierta, y además en localStorage si el
      // navegador lo deja (en incógnito, con bloqueos de privacidad o en el navegador de WhatsApp o
      // Instagram no hay almacenamiento: antes la clave se perdía y volvía al login sin avisar).
      let claveEnMemoria = null;
      const leerClave = () => {
        if (claveEnMemoria) return claveEnMemoria;
        try {
          return localStorage.getItem(KEY);
        } catch {
          return null;
        }
      };
      const guardarClave = (v) => {
        claveEnMemoria = v || null;
        try {
          v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY);
        } catch {}
      };

      const NOMBRES = {
        app_abierta: 'App abierta',
        inicio_visto: 'Inicio visto',
        busqueda: 'Búsquedas',
        busqueda_sin_resultados: 'Búsquedas sin resultado',
        filtro: 'Filtros usados',
        promo_abierta: 'Promos abiertas',
        fuente_abierta: 'Fuente oficial abierta',
        tarjeta_agregada: 'Tarjetas agregadas',
        nivel_cargado: 'Nivel de tarjeta cargado',
        jubilado_activado: 'Casilla de jubilado',
        aviso_diario_activado: 'Aviso diario activado',
        guia_completada: 'Guía completada',
        onboarding_completo: 'Onboarding completo',
        reporte_enviado: 'Reportes enviados',
      };
      const MOTIVOS = {
        no_aplicaron: 'No aplicó',
        ya_no_esta: 'Ya no está',
        datos_mal: 'Datos mal',
        otra_zona: 'Otra zona',
        otro: 'Otro',
      };

      // ——— pantallas ———
      function login(error) {
        nav.hidden = true;
        footer.hidden = true;
        meta.replaceChildren();
        const input = el('input', {
          type: 'password',
          autocomplete: 'current-password',
          autocapitalize: 'off',
          spellcheck: 'false',
          placeholder: 'Clave del panel',
          'aria-label': 'Clave del panel',
          required: '',
        });
        const ver = el('button', {
          type: 'button',
          text: 'Mostrar',
          'aria-label': 'Mostrar la clave',
          onclick: () => {
            const oculta = input.type === 'password';
            input.type = oculta ? 'text' : 'password';
            ver.textContent = oculta ? 'Ocultar' : 'Mostrar';
          },
        });
        const form = el(
          'form',
          {
            class: 'card login',
            onsubmit: (e) => {
              e.preventDefault();
              const clave = input.value.trim();
              if (!clave) return login('Pegá la clave del panel.');
              guardarClave(clave);
              cargar();
            },
          },
          el('h2', { text: 'Entrar al panel' }),
          el('p', { text: 'Pegá la clave del panel. Queda guardada solo en este navegador.' }),
          error ? el('div', { class: 'error-box', text: error }) : null,
          el('div', { class: 'field' }, input, ver),
          el('button', { type: 'submit', class: 'submit', text: 'Ver métricas' }),
        );
        app.replaceChildren(el('div', { class: 'center' }, form));
        input.focus();
      }

      function cargando() {
        app.replaceChildren(
          el(
            'div',
            { class: 'grid g4' },
            ...[0, 1, 2, 3].map(() => el('div', { class: 'skeleton' })),
          ),
          el('div', { class: 'skeleton', style: 'height:300px' }),
        );
      }

      async function cargar() {
        if (demo) return render(datosDemo());
        const clave = leerClave();
        if (!clave) return login();
        cargando();
        try {
          const res = await fetch(API, { headers: { 'x-panel-clave': clave }, cache: 'no-store' });
          if (res.status === 401) {
            guardarClave(null);
            return login('La clave no es correcta.');
          }
          if (!res.ok) throw new Error('El servidor respondió ' + res.status);
          render(await res.json());
        } catch (e) {
          app.replaceChildren(
            el(
              'div',
              { class: 'center' },
              el(
                'div',
                { class: 'card login' },
                el('h2', { text: 'No pudimos traer los datos' }),
                el('p', { text: e.message || 'Revisá la conexión.' }),
                el('button', { class: 'submit', text: 'Reintentar', onclick: cargar }),
              ),
            ),
          );
        }
      }

      function barraSuperior(d, estado) {
        const chip = el(
          'a',
          { class: 'status-chip', href: '#datos', title: 'Calidad de datos' },
          el('span', { class: 'dot ' + estado.tono }),
          el('span', { text: estado.texto }),
        );
        const stamp = el('span', {
          class: 'stamp',
          text:
            'Actualizado ' +
            new Date(d.generado).toLocaleString('es-AR', {
              dateStyle: 'short',
              timeStyle: 'short',
            }),
        });
        const actualizar = el('button', {
          class: 'btn primary',
          text: 'Actualizar',
          onclick: cargar,
        });
        const salir = el('button', {
          class: 'btn',
          text: 'Salir',
          onclick: () => {
            guardarClave(null);
            login();
          },
        });
        meta.replaceChildren(
          chip,
          stamp,
          el('span', { style: 'display:flex;gap:8px' }, actualizar, demo ? null : salir),
        );
      }

      function render(d) {
        document.getElementById('demo').hidden = !demo;
        nav.hidden = false;
        footer.hidden = false;
        const s = estadoSalud(d.salud);
        barraSuperior(d, s.resumen);
        app.replaceChildren(
          encabezado('resumen', 'Resumen', 'Usuarios activos y retención'),
          kpis(d),
          tarjeta(
            'Usuarios activos por día',
            'Instalaciones distintas que abrieron la app',
            graficoActivos(d.diarios),
          ),
          encabezado('uso', 'Uso', 'Últimos 30 días'),
          el(
            'div',
            { class: 'grid g2' },
            tarjeta('Qué se usa', 'Eventos de la app', eventos(d.eventos)),
            tarjeta('Rubros buscados', 'Búsquedas por rubro', ranking(d.dimensiones, 'busqueda')),
          ),
          el(
            'div',
            { class: 'grid g2' },
            tarjeta(
              'Tarjetas y billeteras agregadas',
              'Medios que suma la gente',
              ranking(d.dimensiones, 'tarjeta_agregada'),
            ),
            tarjeta(
              'Filtros del buscador',
              'Qué filtros se tocan',
              ranking(d.dimensiones, 'filtro'),
            ),
          ),
          encabezado('retencion', 'Retención', 'Por día de instalación'),
          tarjeta(
            'Cohortes',
            'De cada día de instalación, cuántos volvieron al día 1, 7 y 30',
            retencion(d.retencion),
          ),
          encabezado('datos', 'Calidad de datos', 'Actualización de promos de cada madrugada'),
          salud(d.salud, s),
          encabezado('errores', 'Errores de la app', 'Últimos 7 días, de más a menos frecuente'),
          tarjeta(null, null, errores(d.errores)),
          encabezado('feedback', 'Feedback', 'Lo que la gente reporta y no encuentra'),
          el(
            'div',
            { class: 'grid g2' },
            tarjeta(
              'Promos reportadas',
              '"Esto no funcionó", últimos 60 días',
              reportadas(d.reportadas),
            ),
            tarjeta(
              'Búsquedas sin resultado',
              'Comercios o bancos que faltan',
              sinResultados(d.sinResultados),
            ),
          ),
        );
        seguirSecciones();
      }

      function encabezado(id, titulo, sub) {
        return el(
          'div',
          { class: 'section-head', id },
          el('h2', { text: titulo }),
          sub ? el('p', { text: sub }) : null,
        );
      }

      function tarjeta(titulo, sub, contenido, extra) {
        return el(
          'section',
          { class: 'card' },
          titulo
            ? el(
                'div',
                { class: 'card-head' },
                el('div', {}, el('h3', { text: titulo }), sub ? el('p', { text: sub }) : null),
                extra || null,
              )
            : null,
          el('div', { class: 'card-body' }, contenido),
        );
      }
      const vacio = (t) => el('p', { class: 'empty', text: t || 'Todavía no hay datos.' });

      // La pestaña de la sección que se está viendo queda marcada.
      function seguirSecciones() {
        const links = [...nav.querySelectorAll('a')];
        // La última sección cuyo título ya pasó por debajo de la barra (al final, la última).
        const marcar = () => {
          const alto = document.querySelector('.topbar').offsetHeight;
          // Al saltar a una sección, el título queda debajo de la barra (que en el celular es más alta).
          document.documentElement.style.scrollPaddingTop = alto + 16 + 'px';
          const barra = alto + 24;
          const alFinal = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
          let actual = links[0];
          for (const a of links) {
            const t = document.querySelector(a.hash);
            if (t && t.getBoundingClientRect().top <= barra) actual = a;
          }
          if (alFinal) actual = links.at(-1);
          links.forEach((a) => a.classList.toggle('on', a === actual));
        };
        if (!seguirSecciones.activo) {
          seguirSecciones.activo = true;
          addEventListener('scroll', marcar, { passive: true });
        }
        marcar();
      }

      // ——— resumen ———
      function delta(actual, anterior) {
        if (actual == null || !anterior) return null;
        const p = ((actual - anterior) / anterior) * 100;
        const signo = p > 0.5 ? 'up' : p < -0.5 ? 'down' : '';
        const txt =
          (p > 0 ? '+' : '') + p.toLocaleString('es-AR', { maximumFractionDigits: 0 }) + '%';
        return el('span', { class: 'delta ' + signo, text: txt });
      }

      function sparkline(valores) {
        if (valores.length < 2) return null;
        const W = 84,
          H = 24;
        const max = Math.max(...valores, 1);
        const min = Math.min(...valores);
        const y = (v) => H - 2 - ((v - min) / (max - min || 1)) * (H - 4);
        const pts = valores.map(
          (v, i) => `${((i / (valores.length - 1)) * W).toFixed(1)},${y(v).toFixed(1)}`,
        );
        const s = svgEl('svg', { class: 'spark', viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' });
        s.append(
          svgEl('polyline', {
            points: pts.join(' '),
            fill: 'none',
            stroke: 'var(--chart)',
            'stroke-width': 1.5,
            'stroke-linejoin': 'round',
            'stroke-linecap': 'round',
          }),
        );
        return s;
      }

      function kpis(d) {
        const diarios = d.diarios || [];
        const hoy = diarios.at(-1);
        const ayer = diarios.at(-2);
        const semana = d.semanales[0];
        const semanaAnt = d.semanales[1];
        const mes = d.mensuales[0];
        const mesAnt = d.mensuales[1];
        const conD7 = d.retencion.filter((r) => r.d7_pct != null);
        const d7 = conD7.length
          ? conD7.reduce((a, r) => a + Number(r.d7_pct), 0) / conD7.length
          : null;
        const nuevas7 = d.retencion.slice(0, 7).reduce((a, r) => a + Number(r.nuevas || 0), 0);
        const ultimos = diarios.slice(-30).map((r) => Number(r.activos));

        const item = (etiqueta, valor, pie) =>
          el(
            'div',
            { class: 'card kpi' },
            el('span', { class: 'kpi-label', text: etiqueta }),
            el('span', { class: 'kpi-value tnum', text: valor }),
            el('div', { class: 'kpi-foot' }, ...pie),
          );
        return el(
          'div',
          { class: 'grid g4' },
          item('Activos hoy', hoy ? num(hoy.activos) : '—', [
            el('span', {
              class: 'kpi-note',
              text: ayer ? `Ayer ${num(ayer.activos)}` : 'Sin datos de ayer',
            }),
            sparkline(ultimos),
          ]),
          item('Activos esta semana', semana ? num(semana.activos) : '—', [
            semanaAnt
              ? delta(Number(semana?.activos), Number(semanaAnt.activos))
              : el('span', { class: 'kpi-note', text: 'Semana en curso' }),
            semanaAnt ? el('span', { class: 'kpi-note', text: 'vs. semana anterior' }) : null,
          ]),
          item('Activos este mes', mes ? num(mes.activos) : '—', [
            mesAnt
              ? delta(Number(mes?.activos), Number(mesAnt.activos))
              : el('span', { class: 'kpi-note', text: 'Mes en curso' }),
            mesAnt ? el('span', { class: 'kpi-note', text: 'vs. mes anterior' }) : null,
          ]),
          item('Vuelven a los 7 días', d7 == null ? '—' : porcentaje(d7), [
            el('span', {
              class: 'kpi-note',
              text: `${plural(nuevas7, 'instalación nueva', 'instalaciones nuevas')} en 7 días`,
            }),
          ]),
        );
      }

      // ——— gráfico de activos, con rango y detalle al pasar el mouse ———
      function graficoActivos(todas) {
        if (!todas.length) return vacio();
        const cont = el('div', {});
        const rangos = [
          ['30 días', 30],
          ['90 días', 90],
        ];
        let dias = todas.length > 30 ? 30 : todas.length;
        const botones = rangos.map(([t, n]) =>
          el('button', {
            type: 'button',
            text: t,
            class: n === dias ? 'on' : '',
            onclick: () => {
              dias = n;
              botones.forEach((b, i) => b.classList.toggle('on', rangos[i][1] === n));
              dibujar();
            },
          }),
        );
        const rango = el(
          'div',
          { class: 'range', role: 'group', 'aria-label': 'Rango' },
          ...botones,
        );
        const lienzo = el('div', { class: 'chart-wrap' });
        cont.append(
          el('div', { style: 'display:flex;justify-content:flex-end;margin:-6px 0 6px' }, rango),
          lienzo,
        );

        function dibujar() {
          const rows = todas.slice(-dias);
          // Al ancho real (en el celular, con un ancho fijo los textos de los ejes quedaban mínimos).
          const W = Math.max(280, Math.round(lienzo.clientWidth || 900)),
            H = W < 600 ? 200 : 260,
            PL = 40,
            PB = 26,
            PT = 8;
          const max = Math.max(...rows.map((r) => Number(r.activos)), 1);
          const paso = Math.pow(10, Math.floor(Math.log10(max)));
          const tope = Math.ceil(max / paso) * paso || 1;
          const x = (i) => PL + (rows.length === 1 ? 0 : (i / (rows.length - 1)) * (W - PL));
          const y = (v) => PT + (1 - v / tope) * (H - PT - PB);
          const s = svgEl('svg', {
            viewBox: `0 0 ${W} ${H}`,
            role: 'img',
            'aria-label': `Usuarios activos por día, últimos ${rows.length} días`,
          });
          // Líneas guía y escala.
          for (let k = 0; k <= 4; k++) {
            const v = (tope / 4) * k;
            s.append(svgEl('line', { x1: PL, x2: W, y1: y(v), y2: y(v), stroke: 'var(--line-2)' }));
            const t = svgEl('text', {
              x: PL - 8,
              y: y(v) + 4,
              'font-size': 11,
              fill: 'var(--muted)',
              'text-anchor': 'end',
            });
            t.textContent = num(Math.round(v));
            s.append(t);
          }
          const pts = rows.map((r, i) => [x(i), y(Number(r.activos))]);
          const linea = pts
            .map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1))
            .join('');
          s.append(
            svgEl('path', {
              d: `${linea}L${x(rows.length - 1)},${y(0)}L${x(0)},${y(0)}Z`,
              fill: 'var(--chart-fill)',
            }),
          );
          s.append(
            svgEl('path', {
              d: linea,
              fill: 'none',
              stroke: 'var(--chart)',
              'stroke-width': 2,
              'stroke-linejoin': 'round',
            }),
          );
          // Fechas abajo: hasta 6, la primera y la última pegadas a los bordes.
          const marcas = Math.min(W < 600 ? 4 : 6, rows.length);
          for (let k = 0; k < marcas; k++) {
            const i = marcas === 1 ? 0 : Math.round((k / (marcas - 1)) * (rows.length - 1));
            const t = svgEl('text', {
              x: x(i),
              y: H - 6,
              'font-size': 11,
              fill: 'var(--muted)',
              'text-anchor': k === 0 ? 'start' : k === marcas - 1 ? 'end' : 'middle',
            });
            t.textContent = fecha(rows[i].dia);
            s.append(t);
          }
          const guia = svgEl('line', {
            y1: PT,
            y2: H - PB,
            stroke: 'var(--muted)',
            'stroke-dasharray': '3 3',
            opacity: 0,
          });
          const punto = svgEl('circle', {
            r: 4,
            fill: 'var(--card)',
            stroke: 'var(--chart)',
            'stroke-width': 2,
            opacity: 0,
          });
          s.append(guia, punto);
          const tip = el('div', { class: 'tip' });
          lienzo.replaceChildren(s, tip);

          const mover = (clientX) => {
            const r = s.getBoundingClientRect();
            const vx = ((clientX - r.left) / r.width) * W;
            const i = Math.max(
              0,
              Math.min(rows.length - 1, Math.round(((vx - PL) / (W - PL)) * (rows.length - 1))),
            );
            const [px, py] = pts[i];
            guia.setAttribute('x1', px);
            guia.setAttribute('x2', px);
            guia.setAttribute('opacity', 0.5);
            punto.setAttribute('cx', px);
            punto.setAttribute('cy', py);
            punto.setAttribute('opacity', 1);
            tip.replaceChildren(
              el('b', { class: 'tnum', text: num(rows[i].activos) }),
              document.createTextNode(' activos · ' + fechaLarga(rows[i].dia)),
            );
            tip.style.left = (px / W) * r.width + 'px';
            tip.style.top = (py / H) * r.height + 'px';
            tip.style.opacity = 1;
          };
          const salir = () => {
            guia.setAttribute('opacity', 0);
            punto.setAttribute('opacity', 0);
            tip.style.opacity = 0;
          };
          s.addEventListener('mousemove', (e) => mover(e.clientX));
          s.addEventListener('touchmove', (e) => e.touches[0] && mover(e.touches[0].clientX), {
            passive: true,
          });
          s.addEventListener('mouseleave', salir);
          s.addEventListener('touchend', salir);
        }
        // Se dibuja cuando ya está en la página (para saber el ancho) y de nuevo si cambia el ancho.
        let ancho = 0;
        new ResizeObserver(() => {
          if (Math.abs(lienzo.clientWidth - ancho) < 8) return;
          ancho = lienzo.clientWidth;
          dibujar();
        }).observe(lienzo);
        return cont;
      }

      function tabla(cabeza, filas) {
        const t = el('table', {});
        t.append(
          el(
            'thead',
            {},
            el('tr', {}, ...cabeza.map(([txt, n]) => el('th', { class: n ? 'n' : '', text: txt }))),
          ),
        );
        const body = el('tbody', {});
        // Cada celda es un nodo (se pone tal cual) o [texto, numérica, clase extra].
        for (const f of filas)
          body.append(
            el(
              'tr',
              {},
              ...f.map((c) =>
                c instanceof Node
                  ? el('td', { class: c.dataset?.n ? 'n' : '' }, c)
                  : el('td', { class: [c[1] ? 'n' : '', c[2] || ''].join(' ').trim(), text: c[0] }),
              ),
            ),
          );
        t.append(body);
        return el('div', { class: 'table-wrap' }, t);
      }

      // Celda de retención con fondo más intenso cuanto más alto el porcentaje.
      function celdaRetencion(v) {
        const span = el('span', { class: 'heat tnum', text: v == null ? '—' : porcentaje(v) });
        if (v != null) {
          const a = Math.min(1, Number(v) / 60);
          span.style.background = `rgba(26, 122, 93, ${(0.08 + a * 0.5).toFixed(2)})`;
          if (a > 0.6) span.style.color = '#fff';
        }
        span.dataset.n = '1';
        return span;
      }

      function retencion(rows) {
        if (!rows.length) return vacio();
        return tabla(
          [['Instalados el'], ['Nuevos', 1], ['Día 1', 1], ['Día 7', 1], ['Día 30', 1]],
          rows
            .slice(0, 14)
            .map((r) => [
              [fechaLarga(r.cohorte), 0, 'strong'],
              [num(r.nuevas), 1],
              celdaRetencion(r.d1_pct),
              celdaRetencion(r.d7_pct),
              celdaRetencion(r.d30_pct),
            ]),
        );
      }

      function barras(lista, etiqueta) {
        const max = lista[0][1] || 1;
        const total = lista.reduce((a, [, n]) => a + n, 0);
        return tabla(
          [[etiqueta], ['Veces', 1], ['%', 1]],
          lista.map(([k, n]) => [
            el(
              'div',
              { class: 'barcell' },
              el('span', { text: k }),
              el(
                'div',
                { class: 'bar' },
                el('i', { style: `width:${((n / max) * 100).toFixed(1)}%` }),
              ),
            ),
            [num(n), 1],
            [porcentaje((n / total) * 100), 1],
          ]),
        );
      }

      function eventos(rows) {
        if (!rows.length) return vacio();
        const tot = {};
        for (const r of rows) tot[r.evento] = (tot[r.evento] || 0) + Number(r.cantidad);
        const lista = Object.entries(tot)
          .sort((a, b) => b[1] - a[1])
          .map(([e, n]) => [NOMBRES[e] || e, n]);
        return barras(lista, 'Evento');
      }

      function ranking(rows, evento) {
        const tot = {};
        for (const r of rows.filter((x) => x.evento === evento))
          tot[r.dimension] = (tot[r.dimension] || 0) + Number(r.cantidad);
        const lista = Object.entries(tot)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 12)
          .map(([k, n]) => [k === 'texto' ? 'Texto libre' : k, n]);
        if (!lista.length) return vacio();
        return barras(lista, '');
      }

      function sinResultados(rows) {
        if (!rows.length)
          return vacio('Nadie buscó algo que no encontrara. O todavía no hay datos.');
        return tabla(
          [['Buscaron'], ['Veces', 1], ['Última vez', 1]],
          rows.map((r) => [
            [r.texto, 0, 'strong'],
            [num(r.veces), 1],
            [fecha(r.ultima_vez), 1],
          ]),
        );
      }

      function reportadas(rows) {
        if (!rows.length) return vacio('Sin reportes. Buena señal.');
        const lista = el('div', {});
        for (const r of rows) {
          const motivos = el('div', { class: 'badges extra' });
          for (const [k, label] of Object.entries(MOTIVOS))
            if (Number(r[k]))
              motivos.append(el('span', { class: 'badge warn', text: `${label} · ${r[k]}` }));
          if (!r.sigue_activa)
            motivos.append(el('span', { class: 'badge', text: 'Ya no está activa' }));
          const quotes = (r.ultimos_comentarios || []).map((c) =>
            el('div', { class: 'quote extra', text: '“' + c + '”' }),
          );
          lista.append(
            el(
              'div',
              { class: 'issue' },
              el('span', { class: 'dot warn' }),
              el(
                'div',
                {},
                el('div', {
                  class: 'issue-title',
                  text: `${r.marca || '—'} · ${r.descuento_porcentaje ?? '?'}%`,
                }),
                el('div', { class: 'issue-meta', text: r.banco_tarjeta || '' }),
              ),
              el('div', { class: 'issue-side', text: plural(r.reportes, 'reporte', 'reportes') }),
              motivos,
              ...quotes,
            ),
          );
        }
        return lista;
      }

      // ——— salud de los datos (docs/decisiones/0013) ———
      /** Una fase que no corrió en 26 h (el cron es diario) cuenta como caída. */
      const HORAS_SIN_CORRER = 26;
      const sinCorrer = (f) =>
        !f.corrida || Date.now() - new Date(f.corrida).getTime() > HORAS_SIN_CORRER * 3600000;
      const noDisponible = () =>
        vacio('No disponible todavía: falta aplicar la migración de errores y salud.');

      function estadoSalud(s) {
        if (!s || !s.fases) return { resumen: { tono: 'amber', texto: 'Datos: sin registro' } };
        const fases = s.fases || [];
        // Sin ninguna fila y con un registro de menos de 26 h: la fase todavía no pasó desde que
        // se empezó a registrar (no es una falla). Con más historia, sí cuenta como caída.
        const registroNuevo =
          !s.desde || Date.now() - new Date(s.desde).getTime() < HORAS_SIN_CORRER * 3600000;
        const esperando = fases.filter((f) => !f.corrida && registroNuevo);
        const conFallas = fases.filter((f) => !sinCorrer(f) && Number(f.fallidas) > 0);
        const sinCorrerLista = fases.filter((f) => sinCorrer(f) && !esperando.includes(f));
        const bien = fases.length - conFallas.length - sinCorrerLista.length - esperando.length;
        // Una fila por fuente: los reintentos de la misma fuente se juntan (antes salía 4 veces).
        const porFuente = new Map();
        for (const f of s.fallas || []) {
          const k = f.fuente + '|' + f.fase;
          const prev = porFuente.get(k);
          if (!prev) porFuente.set(k, { ...f, intentos: 1 });
          else {
            prev.intentos++;
            if (new Date(f.corrida) > new Date(prev.corrida))
              Object.assign(prev, { ...f, intentos: prev.intentos });
          }
        }
        const fallas = [...porFuente.values()].sort(
          (a, b) => new Date(b.corrida) - new Date(a.corrida),
        );
        const problemas = fallas.length + sinCorrerLista.length;
        const resumen = problemas
          ? {
              tono: 'warn',
              texto: `Datos: ${plural(problemas, 'problema', 'problemas')}`,
            }
          : (s.caidas || []).length
            ? { tono: 'amber', texto: 'Datos: fuentes con menos promos' }
            : { tono: '', texto: 'Datos al día' };
        return { fases, esperando, conFallas, sinCorrerLista, bien, fallas, resumen };
      }

      function salud(s, e) {
        if (!s || !s.fases) return tarjeta(null, null, noDisponible());
        const caidas = s.caidas || [];
        const activas = s.promosActivas || [];
        const total = activas.reduce((a, p) => a + Number(p.activas), 0);

        const resumen = el(
          'div',
          { class: 'health-summary' },
          el(
            'div',
            {},
            el('b', { class: 'tnum', text: num(e.bien) }),
            el('span', { text: 'Fases bien' }),
          ),
          el(
            'div',
            {},
            el('b', {
              class: 'tnum',
              text: num(e.fallas.length),
              style: e.fallas.length ? 'color:var(--warn)' : '',
            }),
            el('span', { text: 'Fuentes con fallas (24 h)' }),
          ),
          el(
            'div',
            {},
            el('b', {
              class: 'tnum',
              text: num(caidas.length),
              style: caidas.length ? 'color:var(--amber)' : '',
            }),
            el('span', { text: 'Trajeron menos que de costumbre' }),
          ),
          el(
            'div',
            {},
            el('b', { class: 'tnum', text: num(total) }),
            el('span', { text: 'Promos activas' }),
          ),
        );

        const cuerpo = el('div', { class: 'card-body' });
        if (e.esperando.length)
          cuerpo.append(
            vacio(
              `${plural(e.esperando.length, 'fase todavía sin registro', 'fases todavía sin registro')}: aparecen después de la corrida de la madrugada (02:00 a 04:45).`,
            ),
          );

        cuerpo.append(el('div', { class: 'subhead', text: 'Fuentes que fallaron · últimas 24 h' }));
        if (!e.fallas.length) cuerpo.append(vacio('Ninguna fuente falló.'));
        for (const f of e.fallas)
          cuerpo.append(
            el(
              'div',
              { class: 'issue' },
              el('span', { class: 'dot warn' }),
              el(
                'div',
                {},
                el('div', { class: 'issue-title', text: f.fuente }),
                el('div', {
                  class: 'issue-meta',
                  text: `${f.banco_tarjeta || '—'} · fase ${f.fase}`,
                }),
              ),
              el('div', {
                class: 'issue-side',
                text: `${f.intentos > 1 ? plural(f.intentos, 'intento', 'intentos') + ' · ' : ''}último ${fechaHora(f.corrida)}`,
              }),
              el('div', { class: 'mono', text: f.error || 'Sin detalle' }),
            ),
          );

        if (e.sinCorrerLista.length) {
          cuerpo.append(el('div', { class: 'subhead', text: 'Fases que no corrieron' }));
          for (const f of e.sinCorrerLista)
            cuerpo.append(
              el(
                'div',
                { class: 'issue' },
                el('span', { class: 'dot warn' }),
                el('div', { class: 'issue-title', text: f.fase }),
                el('div', {
                  class: 'issue-side',
                  text: f.corrida ? `última vez ${fechaHora(f.corrida)}` : 'sin corridas en 8 días',
                }),
              ),
            );
        }

        cuerpo.append(
          el('div', { class: 'subhead', text: 'Trajeron mucho menos que de costumbre' }),
        );
        if (!caidas.length)
          cuerpo.append(vacio('Ninguna fuente trajo menos de la mitad de su promedio.'));
        else
          cuerpo.append(
            tabla(
              [['Fuente'], ['Trajo', 1], ['Promedio 7 días', 1], ['% del promedio', 1]],
              caidas.map((c) => [
                el(
                  'div',
                  {},
                  el('div', { class: 'issue-title', text: c.fuente }),
                  el('div', {
                    class: 'issue-meta',
                    text: `${c.banco_tarjeta || '—'} · fase ${c.fase}`,
                  }),
                ),
                [num(c.encontrados), 1],
                [num(c.promedio_7d), 1],
                (() => {
                  const b = el('span', { class: 'badge amber tnum', text: porcentaje(c.pct) });
                  b.dataset.n = '1';
                  return b;
                })(),
              ]),
            ),
          );

        // Lo que cada fuente descartó en su última corrida (02/10/2026): medios que la app no tiene,
        // vencidas, sin días… Sirve para ver qué medio sumar o qué parser mejorar.
        const omitidas = s.omitidas || [];
        cuerpo.append(
          el('div', { class: 'subhead', text: 'Promos que no se cargaron · última corrida' }),
        );
        if (!omitidas.length) cuerpo.append(vacio('Ninguna fuente descartó promos.'));
        else {
          const totalOmitidas = omitidas.reduce((a, o) => a + Number(o.omitidas_cantidad), 0);
          cuerpo.append(
            vacio(
              `${plural(totalOmitidas, 'promo descartada', 'promos descartadas')} en ${plural(omitidas.length, 'fuente', 'fuentes')}. Debajo de cada fuente, por qué.`,
            ),
          );
          const fila = (o) => [
            el(
              'div',
              {},
              el('div', { class: 'issue-title', text: o.fuente }),
              el('div', {
                class: 'issue-meta',
                text: `${o.banco_tarjeta || '—'} · fase ${o.fase} · ${fechaHora(o.corrida)}`,
              }),
              el('div', {
                class: 'mono',
                text: String(o.omitidas || '').replace(/^omitidas: /, ''),
              }),
            ),
            [num(o.insertados), 1],
            (() => {
              const b = el('span', {
                class: 'badge amber tnum',
                text: num(o.omitidas_cantidad),
              });
              b.dataset.n = '1';
              return b;
            })(),
          ];
          const columnas = [['Fuente y motivos'], ['Cargó', 1], ['Descartó', 1]];
          const VISIBLES = 10;
          cuerpo.append(tabla(columnas, omitidas.slice(0, VISIBLES).map(fila)));
          if (omitidas.length > VISIBLES) {
            const resto = el(
              'details',
              {},
              el('summary', { text: `Ver las otras ${omitidas.length - VISIBLES}` }),
            );
            resto.append(tabla(columnas, omitidas.slice(VISIBLES).map(fila)));
            cuerpo.append(resto);
          }
        }

        const fases = e.fases;
        if (fases.length) {
          const orden = [...fases].sort(
            (a, b) =>
              Number(sinCorrer(b)) - Number(sinCorrer(a)) ||
              Number(b.fallidas) - Number(a.fallidas) ||
              String(a.fase).localeCompare(String(b.fase)),
          );
          const t = tabla(
            [['Fase'], ['Última corrida', 1], ['Fuentes', 1], ['Trajo', 1], ['Estado', 1]],
            orden.map((f) => {
              const estado = sinCorrer(f)
                ? el('span', { class: 'badge warn', text: 'No corrió' })
                : Number(f.fallidas) > 0
                  ? el('span', { class: 'badge warn', text: `Fallaron ${f.fallidas}` })
                  : el('span', { class: 'badge ok', text: 'Bien' });
              estado.dataset.n = '1';
              return [
                [f.fase, 0, 'strong'],
                [f.corrida ? fechaHora(f.corrida) : '—', 1],
                [num(f.fuentes), 1],
                [num(f.encontrados), 1],
                estado,
              ];
            }),
          );
          const wrap = el(
            'details',
            { style: 'margin-top:12px' },
            el('summary', { text: `Ver las ${fases.length} fases` }),
          );
          wrap.append(t);
          cuerpo.append(wrap);
        }

        const card = el('section', { class: 'card' }, resumen, cuerpo);
        if (!activas.length) return card;
        const top = activas.slice(0, 12).map((p) => [p.producto, Number(p.activas)]);
        return el(
          'div',
          { class: 'grid g32' },
          card,
          tarjeta(
            'Promos activas por medio',
            `${num(total)} en ${plural(activas.length, 'medio', 'medios')}`,
            barras(top, 'Banco, billetera o programa'),
          ),
        );
      }

      function errores(rows) {
        if (!rows) return noDisponible();
        if (!rows.length) return vacio('Sin errores en los últimos 7 días.');
        const lista = el('div', {});
        for (const e of rows) {
          const badges = el('div', { class: 'badges extra' });
          if (Number(e.fatales))
            badges.append(el('span', { class: 'badge warn', text: `${num(e.fatales)} fatales` }));
          badges.append(
            el('span', {
              class: 'badge',
              text: plural(e.instalaciones_7d, 'instalación', 'instalaciones'),
            }),
          );
          if (e.ruta) badges.append(el('span', { class: 'badge', text: e.ruta }));
          for (const p of e.plataformas || [])
            badges.append(el('span', { class: 'badge', text: p }));
          const versiones = (e.versiones || []).join(', ') || e.version_ultima || '—';
          const item = el(
            'div',
            { class: 'issue' },
            el('span', { class: 'dot ' + (Number(e.fatales) ? 'warn' : 'amber') }),
            el(
              'div',
              {},
              el('div', { class: 'issue-title mono', text: `${e.nombre}: ${e.mensaje}` }),
              el('div', {
                class: 'issue-meta',
                text: `Primera vez ${fechaHora(e.primera_vez)} · última ${fechaHora(e.ultima_vez)} · versiones ${versiones} · ${num(e.veces_total)} en total`,
              }),
            ),
            el('div', { class: 'issue-side', text: plural(e.veces_7d, 'vez', 'veces') }),
            badges,
          );
          if (e.stack) {
            const d = el('details', { class: 'extra' }, el('summary', { text: 'Ver el stack' }));
            d.append(el('pre', { class: 'mono', text: e.stack }));
            item.append(d);
          }
          lista.append(item);
        }
        return lista;
      }
